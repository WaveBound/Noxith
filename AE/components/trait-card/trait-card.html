<template id="tpl-trait-card">
  <div class="trait-card glass-card">
    <!-- Emblem Banner Header -->
    <div class="trait-card-media">
      <div class="trait-media-aura"></div>
      <img data-role="image" src="" alt="" />
      <span class="trait-badge-rarity" data-role="rarity">Mythic</span>
      <span class="trait-badge-rate" data-role="drop">0.1% Rate</span>
    </div>

    <!-- Card Body & Stats -->
    <div class="trait-card-body">
      <div class="trait-title-block">
        <h3 class="trait-name" data-role="name">---</h3>
        <span class="trait-tag" data-role="tag">---</span>
      </div>

      <!-- Stat Modifiers Grid -->
      <div class="trait-stats-grid" data-role="stats-list">
        <!-- Rendered stat chips -->
      </div>
    </div>
  </div>
</template>
