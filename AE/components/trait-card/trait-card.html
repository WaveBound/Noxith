<template id="tpl-trait-card">
  <div class="trait-card glass-card">
    <div class="trait-card-top-bar">
      <span class="trait-card-rarity-pill" data-role="rarity">Mythic</span>
      <span class="trait-card-drop-pill" data-role="drop">0.1%</span>
    </div>

    <div class="trait-card-hero">
      <div class="trait-card-icon-frame">
        <img data-role="image" src="" alt="" />
      </div>
      <div class="trait-card-header-text">
        <h3 class="trait-card-title" data-role="name">---</h3>
        <span class="trait-card-tag" data-role="tag">---</span>
      </div>
    </div>

    <p class="trait-card-description" data-role="desc">---</p>

    <div class="trait-card-stats-grid" data-role="stats-list">
      <!-- Stat pills injected dynamically -->
    </div>

    <div class="trait-card-footer">
      <span class="trait-card-pity-label">Pity Threshold: <strong data-role="pity">---</strong></span>
      <button type="button" class="trait-card-detail-btn" data-role="detail-btn">
        <span>Details</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
  </div>
</template>
