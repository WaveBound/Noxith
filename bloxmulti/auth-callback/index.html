<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxMulti - Authorization</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            color: #58a6ff;
        }

        p {
            color: #8b949e;
            line-height: 1.5;
        }

        .success {
            color: #3fb950;
        }

        .error {
            color: #f85149;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2 id="heading">Logging into BloxMulti...</h2>
        <p id="subtext">Transferring your session back to the app.</p>
    </div>

    <script>
        const hash = window.location.hash;
        const search = window.location.search;
        const params = new URLSearchParams(search || (hash ? hash.substring(1) : ""));

        const heading = document.getElementById("heading");
        const subtext = document.getElementById("subtext");

        if (params.get("error") || params.get("error_description")) {
            heading.textContent = "Login Failed";
            heading.className = "error";
            subtext.textContent = params.get("error_description") || params.get("error") || "An error occurred during authentication.";
        } else {
            // Forward the auth tokens to BloxMulti desktop app
            window.location.href = "bloxmulti://auth-callback" + (hash || search);

            heading.textContent = "Login Successful!";
            heading.className = "success";
            subtext.textContent = "You can close this tab and return to BloxMulti.";

            // Try closing the tab automatically after 2.5 seconds
            setTimeout(() => {
                window.close();
            }, 2500);
        }
    </script>
</body>

</html>
