<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BloxMulti — Authorization</title>
    <meta name="theme-color" content="#0b0b0b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0b;
            --text: #ececec;
            --muted: #8d8d8d;
            --line: #232323;
            --red: #ff3a5c;
            --glass: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02) 60%)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 42px;
            padding: 0 20px;
            border-radius: 99px;
            font: 500 14px Inter, system-ui, sans-serif;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            transition: .2s
        }

        .btn:hover {
            background: rgba(255, 255, 255, .14)
        }

        .btn.w {
            background: #f1f1f1;
            color: #0b0b0b;
            border-color: #f1f1f1
        }

        .btn.w:hover {
            background: #fff
        }

        .fade {
            background: linear-gradient(180deg, #fff 30%, #6e6e6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        /* same ambient stage as the homepage hero */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(#050505, var(--bg))
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .5;
            animation: drift 18s ease-in-out infinite alternate
        }

        .b1 {
            width: 860px;
            height: 580px;
            right: -80px;
            top: -140px;
            background: radial-gradient(#e9eeec, #7d8683 50%, transparent 72%)
        }

        .b2 {
            width: 720px;
            height: 480px;
            left: -140px;
            bottom: -80px;
            background: radial-gradient(#cfd4d2, #5d6462 55%, transparent 72%);
            animation-delay: -6s
        }

        .b3 {
            width: 340px;
            height: 240px;
            left: 38%;
            top: -120px;
            background: radial-gradient(#fff, transparent 70%);
            opacity: .18;
            animation-delay: -11s
        }

        @keyframes drift {
            to {
                transform: translate(-60px, 40px) scale(1.12)
            }
        }

        .streaks {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 240px;
            height: 300px;
            transform: translateX(-50%)
        }

        .streaks i {
            position: absolute;
            bottom: -100px;
            width: 1px;
            height: 110px;
            background: linear-gradient(transparent, #fff, transparent);
            animation: rise 4.5s linear infinite
        }

        @keyframes rise {
            to {
                transform: translateY(-460px);
                opacity: 0
            }
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(rgba(255, 255, 255, .25) 1px, transparent 1px) 0 0/90px 90px;
            opacity: .12;
            -webkit-mask: radial-gradient(70% 70% at 50% 50%, #000, transparent);
            mask: radial-gradient(70% 70% at 50% 50%, #000, transparent)
        }

        .logo {
            position: fixed;
            top: 22px;
            left: 28px;
            z-index: 5;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -.02em
        }

        .card {
            position: relative;
            z-index: 4;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            padding: 48px 36px;
            border: 1px solid #222;
            border-radius: 22px;
            background: var(--glass), #0e0e0e;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: up .7s cubic-bezier(.16, 1, .3, 1) both
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translate3d(0, 22px, 0)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .icon-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            color: #fff;
            background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03));
            border: 1px solid rgba(255, 255, 255, .16);
            transition: .4s
        }

        .icon-wrapper.muted {
            color: #b9b9b9;
            border-color: rgba(255, 255, 255, .12)
        }

        .icon-wrapper.error {
            color: var(--red);
            background: linear-gradient(160deg, rgba(255, 58, 92, .16), rgba(255, 58, 92, .04));
            border-color: rgba(255, 58, 92, .35)
        }

        .spinner {
            animation: spin 1.1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .title {
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 500;
            letter-spacing: -.045em;
            line-height: 1.05;
            margin-bottom: 14px
        }

        .desc {
            font-size: 15px;
            color: #9a9a9a;
            line-height: 1.65
        }

        #fallback-container .btn {
            margin-top: 24px
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important
            }
        }

        @media(max-width:600px) {
            .logo {
                left: 20px
            }

            .card {
                padding: 40px 24px
            }
        }
    </style>
</head>

<body>
    <div class="bg" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="streaks" id="streaks"></div>
    </div>
    <a class="logo" href="../index.html">BloxMulti</a>

    <div class="card">
        <div class="icon-wrapper" id="icon-container"><svg id="icon-spinner" class="spinner" width="28" height="28"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg></div>
        <h1 class="title fade" id="heading">Logging into BloxMulti...</h1>
        <p class="desc" id="subtext">Transferring your session back to the app.</p>
        <div id="fallback-container"></div>
    </div>
    <script>
        const s = document.getElementById('streaks');
        for (let i = 0; i < 7; i++) { const e = document.createElement('i'); e.style.left = (i * 38 + Math.random() * 14) + 'px'; e.style.animationDelay = (-Math.random() * 4.5) + 's'; e.style.animationDuration = (3.5 + Math.random() * 3) + 's'; e.style.opacity = .4 + Math.random() * .6; s.appendChild(e) }

        const hash = window.location.hash;
        const search = window.location.search;
        const payload = hash || search;

        // Strip tokens and parameters from the address bar immediately
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, document.title, window.location.pathname);
        }

        const params = new URLSearchParams(search || (hash ? hash.substring(1) : ""));
        const heading = document.getElementById("heading");
        const subtext = document.getElementById("subtext");
        const iconContainer = document.getElementById("icon-container");
        const fallbackContainer = document.getElementById("fallback-container");

        if (params.get("error") || params.get("error_description")) {
            heading.textContent = "Login Failed";
            subtext.textContent = params.get("error_description") || params.get("error") || "An error occurred during authentication.";
            iconContainer.className = "icon-wrapper error";
            iconContainer.innerHTML = `
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    `;
        } else {
            const appUrl = "bloxmulti://auth-callback" + payload;

            // Forward to desktop app
            window.location.href = appUrl;

            heading.textContent = "Login Successful";
            subtext.innerHTML = "You can safely close this tab and return to BloxMulti.";
            iconContainer.className = "icon-wrapper success";
            iconContainer.innerHTML = `
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
    `;

            // Manual button in case the browser blocked the protocol handler
            setTimeout(() => {
                fallbackContainer.innerHTML = `<a href="${appUrl}" class="btn w">Open BloxMulti App</a>`;
            }, 1200);

            // Auto-close tab
            setTimeout(() => {
                window.close();
            }, 3000);
        }
    </script>
</body>

</html>
