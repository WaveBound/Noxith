<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful — BloxMulti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --bg: #06050d;
            --accent: #9d6fff;
            --accent-light: #b794f6;
            --accent-glow: rgba(157, 111, 255, 0.25);
            --text: #edeafa;
            --muted: #8f86ab;
            --border: rgba(157, 111, 255, 0.16);
            --font-body: 'Inter', sans-serif;
            --font-display: 'Syne', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* BACKGROUND - UNCHANGED */
        .global-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 75% 10%, rgba(100, 40, 220, 0.45) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 15% 55%, rgba(50, 200, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 85%, rgba(200, 50, 255, 0.10) 0%, transparent 55%),
                linear-gradient(160deg, #07051a 0%, #0d0820 40%, #120a28 70%, #08050f 100%);
        }

        .global-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(120deg, transparent 0px, transparent 40px, rgba(157, 111, 255, 0.015) 40px, rgba(157, 111, 255, 0.015) 41px);
        }

        .card {
            background: rgba(12, 10, 24, 0.72);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 36px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 440px;
            animation: fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: 20px;
        }

        .icon-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, rgba(157, 111, 255, 0.2), rgba(157, 111, 255, 0.05));
            border: 1px solid rgba(157, 111, 255, 0.35);
            box-shadow: 0 0 24px var(--accent-glow), inset 0 0 12px rgba(157, 111, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-light);
            margin-bottom: 24px;
        }

        .title {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #d8d0ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.65;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="global-bg"></div>

    <div class="card">
        <div class="icon-wrapper">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h1 class="title">Welcome to Premium</h1>
        <p class="desc">
            Your payment was successful. BloxMulti will automatically detect your upgrade in a few moments.<br><br>You
            can safely close this tab.
        </p>
    </div>
</body>

</html>
