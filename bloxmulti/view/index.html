<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxMulti - Remote Screen View</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050102;
            color: #f8f2f3;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        video {
            max-width: 95%;
            max-height: 80vh;
            border: 2px solid #d41b2c;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(212, 27, 44, 0.3);
            background: #000;
        }

        #status {
            margin-bottom: 20px;
            font-size: 14px;
            color: #8c7a7d;
        }
    </style>
    <!-- Include PeerJS Client library -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>

<body>
    <div id="status">Connecting to remote instance...</div>
    <video id="remoteVideo" autoplay playsinline muted controls></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code") || window.location.pathname.split("/").pop();

        const statusEl = document.getElementById("status");
        const remoteVideo = document.getElementById("remoteVideo");

        let peer = null;

        function initViewer() {
            if (!code) {
                statusEl.textContent = "Error: Invalid session code.";
                return;
            }

            // Create a randomized viewer peer ID
            peer = new Peer({
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        // Public OpenRelay Project credentials to bypass strict home routers/firewalls
                        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
                    ]
                }
            });

            peer.on('open', (id) => {
                statusEl.textContent = "Connecting to Host signaling...";

                // Initiate call with no local stream (one-way receiver stream)
                const call = peer.call(`bm-${code}`, new MediaStream());

                call.on('stream', (remoteStream) => {
                    statusEl.textContent = "Connected. Displaying stream...";
                    if (remoteVideo.srcObject !== remoteStream) {
                        remoteVideo.srcObject = remoteStream;
                        statusEl.textContent = "Live Stream Active.";
                    }
                });

                call.on('close', () => {
                    statusEl.textContent = "Stream ended by host.";
                    remoteVideo.srcObject = null;
                });
            });

            peer.on('error', (err) => {
                console.error("PeerJS Viewer Error:", err);
                statusEl.textContent = `Connection error: ${err.type || err.message}. Reconnecting...`;
                setTimeout(initViewer, 5000); // Auto-reconnect on failure
            });
        }

        window.onload = initViewer;
    </script>
</body>

</html>
